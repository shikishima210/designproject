<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A1mini マニュアル(見てわかるプロトタイプ)-DesignProject</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  @font-face{font-family:'MB101';font-weight:400;src:local('PGothicMB101Pr6N-Regular'),local('A P-OTF Gothic MB101 Pr6N R');}
  @font-face{font-family:'MB101';font-weight:600;src:local('PGothicMB101Pr6N-DeBold'),local('A P-OTF Gothic MB101 Pr6N DB');}
  @font-face{font-family:'MB101';font-weight:700;src:local('PGothicMB101Pr6N-Bold'),local('A P-OTF Gothic MB101 Pr6N B');}
  :root{
    --bg:#F4F4F4; --ink:#222326; --muted:#55585E; --accent:#28B243; --accent-text:#1E7F33;
    --dark:#333437; --line:#222326; --white:#FFFFFF; --warn:#E5A100;
    --sans:'MB101','Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;
    --num:'Arial Black','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;}
  button{font-family:inherit;color:inherit;}
  [hidden]{display:none!important;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-bottom:env(safe-area-inset-bottom,0px);}

  /* ---------- top ---------- */
  .top{background:var(--dark);color:var(--white);padding-top:env(safe-area-inset-top,0px);}
  .top-row{display:flex;align-items:center;gap:12px;padding:10px 14px 8px;}
  .box-btn{flex:none;font-size:13px;font-weight:600;letter-spacing:.06em;line-height:1.3;color:inherit;text-decoration:none;border:2px solid currentColor;padding:5px 10px;background:transparent;cursor:pointer;}
  .top-title{flex:1;min-width:0;font-size:16px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-title .jp{font-size:12px;font-weight:600;margin-left:8px;}
  .text-toggle{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;border:1.5px solid rgba(255,255,255,.6);background:transparent;padding:5px 8px;cursor:pointer;}
  .text-toggle[aria-pressed="true"]{background:var(--white);color:var(--dark);}
  .segs{display:flex;gap:4px;padding:0 14px 10px;}
  .seg{flex:1;height:5px;border:0;padding:0;background:rgba(255,255,255,.22);cursor:pointer;}
  .seg.is-done{background:rgba(40,178,67,.55);}
  .seg.is-now{background:var(--accent);}
  .seg.is-cond{background-image:repeating-linear-gradient(-45deg,transparent 0 3px,rgba(0,0,0,.45) 3px 6px);}

  /* ---------- stage ---------- */
  .stage{container-type:size;display:grid;place-items:center;padding:10px 10px 0;min-height:0;}
  .frame{position:relative;width:min(100cqw,calc(100cqh * .75));aspect-ratio:3/4;background:#DDD;overflow:hidden;border:2px solid var(--line);}
  .frame img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .ring-base{fill:rgba(40,178,67,.22);stroke:var(--accent);stroke-width:4;}
  .ring-case{fill:none;stroke:#fff;stroke-width:8;}
  .ring-pulse{fill:none;stroke:var(--accent);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-out infinite;}
  .ring-wait{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:14 10;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite;}
  .ring-wait-case{fill:none;stroke:#fff;stroke-width:8;stroke-dasharray:14 10;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite;}
  .arrow-move{animation:nudge 1.1s ease-in-out infinite;}
  .arrow-case{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
  .arrow-line{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
  .check-bg{fill:var(--accent);stroke:#fff;stroke-width:5;}
  .check-mark{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
  @keyframes pulse{0%{transform:scale(1);opacity:.95;}100%{transform:scale(2.1);opacity:0;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes nudge{0%,100%{transform:translateX(0);}50%{transform:translateX(12px);}}

  .map{position:absolute;right:8px;top:8px;width:30%;background:var(--white);border:2px solid var(--line);box-shadow:4px 4px 0 var(--dark);}
  .map img{display:block;width:100%;height:auto;}
  .map-dot{position:absolute;width:16%;aspect-ratio:1;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);transform:translate(-50%,-50%);transition:left .45s ease,top .45s ease;}
  .map-dot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.5s ease-out infinite;}

  .cond{position:absolute;left:0;top:0;width:62%;background:var(--ink);color:var(--white);box-shadow:4px 4px 0 var(--warn);}
  .cond-stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--ink) 0 6px,var(--warn) 6px 12px);}
  .cond-label{display:flex;align-items:center;gap:6px;padding:6px 8px 5px;font-size:12px;font-weight:600;}
  .cond-label svg{width:16px;height:16px;flex:none;stroke:var(--warn);}
  .cond img{display:block;width:100%;height:auto;}

  /* ---------- panel ---------- */
  .panel{padding:10px 14px 12px;display:flex;flex-direction:column;gap:10px;}
  .action{display:flex;align-items:center;gap:14px;min-height:76px;}
  .picto{flex:none;width:72px;height:72px;background:var(--white);border:2px solid var(--line);color:var(--ink);}
  .picto svg{display:block;width:100%;height:100%;}
  .picto .p-ink{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .picto .p-fill{fill:currentColor;stroke:none;}
  .picto .p-acc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
  .picto .p-accfill{fill:var(--accent);stroke:none;}
  .picto .p-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.5s ease-out infinite;}
  .picto .p-nudge{animation:pnudge 1.1s ease-in-out infinite;}
  .picto .p-drop{animation:pdrop 1.3s ease-in-out infinite;}
  .picto .p-spin{transform-box:fill-box;transform-origin:center;animation:spin 3.5s linear infinite;}
  @keyframes pnudge{0%,100%{transform:translateX(0);}50%{transform:translateX(7px);}}
  @keyframes pdrop{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}
  .words{min-width:0;display:flex;flex-direction:column;gap:2px;}
  .verb{font-size:40px;font-weight:700;line-height:1.1;letter-spacing:.02em;}
  .target{font-size:15px;font-weight:600;line-height:1.4;color:var(--accent-text);}
  .more{font-size:13px;}
  .more summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:2px 0;}
  .more summary::-webkit-details-marker{display:none;}
  .more summary::before{content:"+";font-family:var(--num);font-size:14px;}
  .more[open] summary::before{content:"−";}
  .more p{margin:6px 0 0;line-height:1.8;}
  .nav{display:grid;grid-template-columns:1fr auto 1.6fr;gap:10px;align-items:stretch;}
  .nav button{font-size:16px;font-weight:700;border:2px solid var(--line);background:transparent;padding:14px 10px;cursor:pointer;}
  .nav .next{background:var(--accent);color:var(--white);border-color:var(--accent);box-shadow:5px 5px 0 var(--dark);}
  .nav button:disabled{opacity:.3;cursor:default;}
  .count{display:grid;place-items:center;font-family:var(--num);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;min-width:56px;}
  .count b{color:var(--accent-text);font-weight:900;}

  .notext .words,.notext .more{visibility:hidden;}
  .notext .cond-label span{visibility:hidden;}

  .proto-badge{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--white);font-size:10px;font-weight:600;letter-spacing:.12em;padding:3px 8px;pointer-events:none;opacity:.0;}

  @media (min-width:900px){
    .app{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 440px;}
    .top{grid-column:1 / -1;}
    .stage{padding:24px;}
    .panel{align-self:center;padding:24px 40px 24px 8px;gap:22px;}
    .picto{width:104px;height:104px;}
    .verb{font-size:60px;}
    .target{font-size:20px;}
    .more{font-size:15px;}
    .action{gap:20px;}
  }
  @media (prefers-reduced-motion: reduce){
    .ring-pulse,.ring-wait,.ring-wait-case,.arrow-move,.map-dot::after,.picto .p-pulse,.picto .p-nudge,.picto .p-drop,.picto .p-spin{animation:none;}
    .map-dot{transition:none;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-row">
      <a class="box-btn" href="./">← TOP</a>
      <span class="top-title">LOAD<span class="jp">フィラメントロード</span></span>
      <button type="button" class="text-toggle" id="textToggle" aria-pressed="false">文字を隠す</button>
    </div>
    <div class="segs" id="segs"></div>
  </header>

  <main class="stage">
    <div class="frame" id="frame">
      <img class="shot" id="shot" alt="">
      <svg class="marks" id="marks" viewBox="0 0 300 400" aria-hidden="true"></svg>
      <div class="cond" id="cond" hidden>
        <div class="cond-stripe"></div>
        <p class="cond-label" style="margin:0"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21.5 20H2.5L12 3.5Z"/><path d="M12 9.5v4.2"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg><span>この画面が出たときだけ</span></p>
        <img id="condImg" alt="警告画面: フィラメントをツールヘッドまで入れてください">
      </div>
      <div class="map" id="map" role="img">
        <img src="images/map-printer.png" alt="">
        <span class="map-dot" id="mapDot"></span>
      </div>
    </div>
  </main>

  <section class="panel">
    <div class="action">
      <div class="picto" id="picto" aria-hidden="true"></div>
      <div class="words" aria-live="polite">
        <span class="verb" id="verb"></span>
        <span class="target" id="target"></span>
      </div>
    </div>
    <details class="more" id="more"><summary>くわしく</summary><p id="detail"></p></details>
    <div class="nav">
      <button type="button" class="prev" id="prev">← 前へ</button>
      <span class="count"><span><b id="now">1</b> / <span id="total">8</span></span></span>
      <button type="button" class="next" id="next">次へ →</button>
    </div>
  </section>
</div>

<script>
(function(){
  var PICTO = {
    tap:'<svg viewBox="0 0 64 64"><circle class="p-acc p-pulse" cx="30" cy="20" r="9"/><circle class="p-accfill" cx="30" cy="20" r="5"/><path class="p-ink" d="M24 58V30a6 6 0 0 1 12 0v12l10 3a5 5 0 0 1 4 5v8"/></svg>',
    wait:'<svg viewBox="0 0 64 64"><circle class="p-ink" cx="28" cy="36" r="20"/><path class="p-ink" d="M28 24v12l8 5"/><path class="p-acc" d="M50 8q6 6 0 13"/><path class="p-acc" d="M56 3q10 11 0 23"/></svg>',
    set:'<svg viewBox="0 0 64 64"><g class="p-drop"><circle class="p-ink" cx="32" cy="22" r="15"/><circle class="p-ink" cx="32" cy="22" r="4"/></g><path class="p-acc" d="M32 44v10M26 49l6 6 6-6"/><path class="p-ink" d="M12 60h40"/></svg>',
    push:'<svg viewBox="0 0 64 64"><rect class="p-ink" x="44" y="16" width="14" height="32" rx="3"/><circle class="p-fill" cx="51" cy="32" r="3"/><g class="p-nudge"><path class="p-acc" d="M4 32h30M26 24l8 8-8 8"/></g></svg>',
    repeat:'<svg viewBox="0 0 64 64"><g class="p-spin"><path class="p-ink" d="M50 32a18 18 0 1 1-6-13"/><path class="p-ink" d="M45 9v11H34"/></g><g class="p-drop"><path class="p-acc" d="M32 24v12M27 31l5 6 5-6"/></g></svg>',
    done:'<svg viewBox="0 0 64 64"><circle class="p-accfill" cx="32" cy="32" r="24"/><path d="M20 33l9 9 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  var MAP = {screen:[55.9,89.4], nozzle:[31.2,59.6], spool:[84,48], inlet:[78.8,40.4], head:[29.8,33]};
  var MAP_NAME = {screen:'本体の手前にある画面', nozzle:'ノズル', spool:'スプールホルダー', inlet:'フィラメントの差し込み口', head:'ツールヘッドの上'};
  var CARDS = [
    {img:'unload-1.jpg', verb:'タップ', target:'「フィラメント」', picto:'tap', ring:[25.7,48], map:'screen',
     detail:'プリンター画面上の「フィラメント」ボタンをタップする。'},
    {img:'load-1.jpg', verb:'タップ', target:'「ロード」', picto:'tap', ring:[55.3,49.8], map:'screen',
     detail:'続けて「ロード」ボタンをタップする。'},
    {img:'load-2.jpg', verb:'待つ', target:'音が鳴るまで', picto:'wait', wait:[36.5,52,24], map:'screen',
     detail:'音が鳴るまで待つ。その間、プリンターが自動でノズルを加熱し、フィラメント位置を確認して、フィラメントを切る。'},
    {img:'load-3.jpg', verb:'セット', target:'向きに注意', picto:'set', arrow:[47,46,17,28], map:'spool',
     detail:'処理を待っている間に、新しいフィラメントをスプールホルダーにセットする。送り出す向きに注意する。'},
    {img:'load-4.jpg', verb:'通す', target:'チューブの穴へ', picto:'push', ring:[67.7,40], arrow:[68.2,74,68,49], map:'inlet',
     detail:'本体側面の穴からフィラメントをチューブに通す。'},
    {img:'load-4b.jpg', verb:'押し込む', target:'ノズルのところまで', picto:'push', ring:[22,62.5], arrow:[23.4,36,22.4,54], map:'head', cond:'load-warn.jpg',
     detail:'「フィラメントをツールヘッドまで入れてください」と出たら、フィラメントを手でつまみ、ノズルのところまで入るように押し込む。'},
    {img:'load-6.jpg', verb:'送り込む', target:'ノズルから出るまで', picto:'repeat', ring:[41.7,33.8], arrow:[41.7,41,41.7,52], map:'nozzle',
     detail:'フィラメントが曲がったり折れたりしないような力加減で、奥へ送り込む。入れ替えたフィラメントがノズルの先から出てくるまで繰り返す。'},
    {img:'load-7.jpg', verb:'完了', target:'6項目すべてにチェック', picto:'done', check:[33,50], map:'screen',
     detail:'プリンター画面の6項目すべてにチェックが入っていれば、ロードは完了。'}
  ];

  var $ = function(id){ return document.getElementById(id); };
  var shot = $('shot'), marks = $('marks'), segs = $('segs'), cond = $('cond');
  var i = 0;
  $('total').textContent = CARDS.length;

  CARDS.forEach(function(c, n){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'seg' + (c.cond ? ' is-cond' : '');
    b.setAttribute('aria-label', (n + 1) + ' / ' + CARDS.length + ' ' + c.verb);
    b.addEventListener('click', function(){ go(n); });
    segs.appendChild(b);
    var pre = new Image(); pre.src = 'images/' + c.img;
  });

  function px(p){ return [p[0] * 3, p[1] * 4]; }
  function drawMarks(c){
    var h = '';
    if(c.arrow){
      var a = px([c.arrow[0], c.arrow[1]]), b = px([c.arrow[2], c.arrow[3]]);
      var len = Math.hypot(b[0] - a[0], b[1] - a[1]) - 12, ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
      var d = 'M0 0H' + len + 'M' + (len - 14) + ' -12L' + len + ' 0L' + (len - 14) + ' 12';
      h += '<g transform="translate(' + a[0] + ' ' + a[1] + ') rotate(' + ang + ')"><g class="arrow-move"><path class="arrow-case" d="' + d + '"/><path class="arrow-line" d="' + d + '"/></g></g>';
    }
    if(c.ring){
      var r = px(c.ring);
      h += '<circle class="ring-pulse" cx="' + r[0] + '" cy="' + r[1] + '" r="20"/><circle class="ring-case" cx="' + r[0] + '" cy="' + r[1] + '" r="20"/><circle class="ring-base" cx="' + r[0] + '" cy="' + r[1] + '" r="20"/>';
    }
    if(c.wait){
      var w = px(c.wait), wr = c.wait[2] * 3;
      h += '<circle class="ring-wait-case" cx="' + w[0] + '" cy="' + w[1] + '" r="' + wr + '"/><circle class="ring-wait" cx="' + w[0] + '" cy="' + w[1] + '" r="' + wr + '"/>';
    }
    if(c.check){
      var k = px(c.check);
      h += '<g transform="translate(' + k[0] + ' ' + k[1] + ')"><circle class="check-bg" r="46"/><path class="check-mark" d="M-22 2l15 16 28-34"/></g>';
    }
    marks.innerHTML = h;
  }

  function go(n){
    i = Math.max(0, Math.min(CARDS.length - 1, n));
    var c = CARDS[i];
    shot.src = 'images/' + c.img;
    shot.alt = c.verb + ' ' + c.target;
    drawMarks(c);
    $('picto').innerHTML = PICTO[c.picto];
    $('verb').textContent = c.verb;
    $('target').textContent = c.target;
    $('detail').textContent = c.detail;
    $('more').open = false;
    cond.hidden = !c.cond;
    if(c.cond) $('condImg').src = 'images/' + c.cond;
    var m = MAP[c.map];
    $('mapDot').style.left = m[0] + '%'; $('mapDot').style.top = m[1] + '%';
    $('map').setAttribute('aria-label', '本体の中の位置: ' + MAP_NAME[c.map]);
    $('now').textContent = i + 1;
    $('prev').disabled = i === 0;
    $('next').textContent = i === CARDS.length - 1 ? 'TOPへ戻る' : '次へ →';
    Array.prototype.forEach.call(segs.children, function(s, k){
      s.classList.toggle('is-done', k < i); s.classList.toggle('is-now', k === i);
    });
    history.replaceState(null, '', '#' + (i + 1));
  }

  $('prev').addEventListener('click', function(){ go(i - 1); });
  $('next').addEventListener('click', function(){
    if(i === CARDS.length - 1){ location.href = './'; return; }
    go(i + 1);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight') go(i + 1);
    if(e.key === 'ArrowLeft') go(i - 1);
  });

  var sx = null, sy = null, frame = $('frame');
  frame.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  frame.addEventListener('touchend', function(e){
    if(sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) go(i + (dx < 0 ? 1 : -1));
    sx = null;
  }, {passive:true});

  var toggle = $('textToggle');
  toggle.addEventListener('click', function(){
    var on = toggle.getAttribute('aria-pressed') !== 'true';
    toggle.setAttribute('aria-pressed', on);
    toggle.textContent = on ? '文字を出す' : '文字を隠す';
    $('app').classList.toggle('notext', on);
  });

  var start = parseInt(location.hash.replace('#', ''), 10);
  go(start >= 1 && start <= CARDS.length ? start - 1 : 0);
})();
</script>
</body>
</html>
